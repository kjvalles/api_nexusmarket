# Application Name
spring.application.name=nexusmarcket

# Server Configuration
server.port=${SERVER_PORT:8080}

# MySQL Configuration (Auto-generación de tablas relacionales)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:nexus_app}
spring.datasource.password=${DB_PASSWORD:nexus_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (Catálogo, Carritos y Auditoría NoSQL)
# Spring Boot 4.x usa el prefijo spring.mongodb.uri
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexus_catalog_db}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:TDEATDEATDEATDEATDEATDEATDEATDEA}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
